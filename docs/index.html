<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routine Anchor</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Routine Anchor</p>
        <h1>Caregiver dashboard</h1>
      </div>
      <div id="mode-banner" class="mode-banner" aria-live="polite"></div>
    </header>

    <main class="shell">
      <section class="panel">
        <h2>Today</h2>
        <div id="checklist"></div>
      </section>

      <section class="panel">
        <h2>Timeline</h2>
        <div id="timeline"></div>
      </section>

      <section class="panel">
        <h2>Alerts</h2>
        <div id="alerts"></div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
