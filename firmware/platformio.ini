[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit SSD1306@^2.5.13
; On-device tests (real ESP32 plugged in over USB):
;   pio test -e esp32dev
test_filter = device/*
test_build_src = yes
test_speed = 115200

; ---------------------------------------------------------------------------
; Cut builds: prove the stubbed modules still compile for the real target.
;   pio run -e esp32dev_nowear -e esp32dev_noloc
[env:esp32dev_nowear]
extends = env:esp32dev
build_flags = -DENABLE_WEAR=0

[env:esp32dev_noloc]
extends = env:esp32dev
build_flags = -DENABLE_WEAR=0 -DENABLE_LOCATION=0

; ---------------------------------------------------------------------------
; Host-side logic tests: runs on your laptop, no board needed, ~seconds.
;   pio test -e native
; Arduino/Wire/WiFi are replaced by fakes in test/mocks/. server.cpp and
; main.cpp are excluded (WebServer is covered by tools/test_device_http.py).
[env:native]
platform = native
test_filter = native/*
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<server.cpp>
build_flags = -std=gnu++17 -DENABLE_DISPLAY=0 -Itest/mocks -Wall -Wno-unused-function
