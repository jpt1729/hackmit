[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit NeoPixel@^1.12.3
; On-device tests (real ESP32 plugged in over USB):
;   pio test -e esp32dev
test_filter = device/*
test_build_src = yes
test_speed = 115200

; ---------------------------------------------------------------------------
; Cut builds: prove the stubbed modules still compile for the real target.
;   pio run -e esp32dev_nowear -e esp32dev_noloc -e esp32dev_min
[env:esp32dev_nowear]
extends = env:esp32dev
build_flags = -DENABLE_WEAR=0

[env:esp32dev_noloc]
extends = env:esp32dev
build_flags = -DENABLE_WEAR=0 -DENABLE_LOCATION=0

; Time-only prompts: no wear estimate, no room estimate, no GPS/geofence.
[env:esp32dev_min]
extends = env:esp32dev
build_flags = -DENABLE_WEAR=0 -DENABLE_LOCATION=0 -DENABLE_GPS=0

; ---------------------------------------------------------------------------
; Showcase build: no WiFi, no sensors, nothing to set up. src/demo.cpp walks
; g_state through every situation the band knows about and lets the real
; ledsTick()/displayTick() draw it, on a loop, narrated over the monitor.
;   pio run -e esp32dev_demo -t upload && pio device monitor
; Add -DDEMO_BUZZER=0 to the flags below for a silent demo.
[env:esp32dev_demo]
extends = env:esp32dev
build_flags = -DDEMO_MODE=1
build_src_filter = +<*> -<main.cpp> -<server.cpp>

; ---------------------------------------------------------------------------
; Host-side logic tests: runs on your laptop, no board needed, ~seconds.
;   pio test -e native
; Arduino/Wire/WiFi/Serial2 are replaced by fakes in test/mocks/. server.cpp and
; main.cpp are excluded (WebServer is covered by tools/test_device_http.py).
; The OLED and the NeoPixel ring are compiled out: their libraries are
; hardware-only, so the tests cover the logic that decides what they show.
[env:native]
platform = native
test_filter = native/*
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<server.cpp>
build_flags =
  -std=gnu++17 -Wall -Wno-unused-function -Itest/mocks
  -DENABLE_DISPLAY=0 -DENABLE_LEDS=0
  -DUNITY_INCLUDE_DOUBLE -DUNITY_DOUBLE_PRECISION=1e-9
